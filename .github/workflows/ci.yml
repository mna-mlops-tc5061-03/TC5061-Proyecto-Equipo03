name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    # Un job por objetivo de make, para ver por separado cuál falla
    name: ${{ matrix.objetivo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        objetivo: [lint, test, security]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: make ${{ matrix.objetivo }}
        run: make ${{ matrix.objetivo }}

  docker:
    name: image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Construir la imagen con make image
        run: make image

      - name: Levantar el contenedor con un modelo de prueba y verificar /health
        run: |
          mkdir -p /tmp/prueba && chmod 777 /tmp/prueba
          docker run --rm -v /tmp/prueba:/tmp/prueba mibici-api python -c "
          import mlflow.sklearn
          from mlflow.models import infer_signature
          import pandas as pd
          from sklearn.frozen import FrozenEstimator
          from sklearn.linear_model import LogisticRegression
          from sklearn.model_selection import FixedThresholdClassifier
          from mi_bici.api.esquemas import EJEMPLO_P2
          from mi_bici.config import VARIABLES_P2

          X = pd.DataFrame(EJEMPLO_P2)[VARIABLES_P2]
          clf = LogisticRegression().fit(X, [0, 0, 1])
          modelo = FixedThresholdClassifier(
              FrozenEstimator(clf), threshold=0.5, response_method='predict_proba'
          )
          mlflow.sklearn.save_model(
              modelo, '/tmp/prueba/modelo', signature=infer_signature(X, modelo.predict(X))
          )
          "
          docker run -d --name mibici-api-test -p 8000:8000 \
            -v /tmp/prueba/modelo:/tmp/modelo:ro \
            -e MODELO_URI=/tmp/modelo \
            mibici-api
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"estado":"ok"'; then
              curl -fsS http://127.0.0.1:8000/health
              docker rm -f mibici-api-test
              exit 0
            fi
            sleep 1
          done
          docker logs mibici-api-test
          docker rm -f mibici-api-test
          exit 1
