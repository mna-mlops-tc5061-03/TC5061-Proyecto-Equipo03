name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    # Un job por objetivo de make, para ver por separado cuál falla
    name: ${{ matrix.objetivo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        objetivo: [lint, test, security]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: make ${{ matrix.objetivo }}
        run: make ${{ matrix.objetivo }}
