name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    # Un job por objetivo de make, para ver por separado cuál falla
    name: ${{ matrix.objetivo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        objetivo: [lint, test, security]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: make ${{ matrix.objetivo }}
        run: make ${{ matrix.objetivo }}

  docker:
    name: image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Construir la imagen con make image
        run: make image

      - name: Levantar el contenedor con modelos de prueba y verificar /health y cada /predict
        run: |
          mkdir -p /tmp/prueba && chmod 777 /tmp/prueba
          # Los modelos y las solicitudes de prueba se generan con la imagen, que ya trae MLflow
          docker run --rm -v /tmp/prueba:/tmp/prueba -v "$PWD/tests/ci:/ci:ro" mibici-api \
            python /ci/modelos_prueba.py /tmp/prueba
          docker run -d --name mibici-api-test -p 8000:8000 \
            -v /tmp/prueba/modelo:/tmp/modelo:ro \
            -v /tmp/prueba/modelo_p1:/tmp/modelo_p1:ro \
            -e MODELO_URI=/tmp/modelo \
            -e MODELO_URI_P1=/tmp/modelo_p1 \
            mibici-api
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"estado":"ok"'; then
              curl -fsS http://127.0.0.1:8000/health
              if curl -fsS -X POST http://127.0.0.1:8000/predict/riesgo \
                -H "Content-Type: application/json" \
                -d @/tmp/prueba/solicitud.json | grep -q '"predicciones":' \
                && curl -fsS -X POST http://127.0.0.1:8000/predict/demanda \
                -H "Content-Type: application/json" \
                -d @/tmp/prueba/solicitud_p1.json | grep -q '"predicciones":'; then
                docker rm -f mibici-api-test
                exit 0
              fi
              break
            fi
            sleep 1
          done
          docker logs mibici-api-test
          docker rm -f mibici-api-test
          exit 1

  compose:
    # El sistema completo como lo levanta make sistema: MLflow y la API en su red, con la API
    # esperando a que MLflow esté sano. Los modelos de prueba entran por docker-compose.ci.yml
    name: compose
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Construir la imagen de la API con Compose
        run: docker compose build api

      - name: Generar los modelos de prueba
        run: |
          mkdir -p /tmp/prueba && chmod 777 /tmp/prueba
          docker run --rm -v /tmp/prueba:/tmp/prueba -v "$PWD/tests/ci:/ci:ro" mibici-api \
            python /ci/modelos_prueba.py /tmp/prueba

      - name: Levantar MLflow y la API y esperar a que estén sanos
        run: docker compose up -d --wait

      - name: Verificar MLflow, /health y cada /predict
        run: |
          docker compose ps
          curl -fsS http://127.0.0.1:5000/health
          curl -fsS http://127.0.0.1:8000/health | grep -q '"estado":"ok"'
          curl -fsS -X POST http://127.0.0.1:8000/predict/riesgo \
            -H "Content-Type: application/json" \
            -d @/tmp/prueba/solicitud.json | grep -q '"predicciones":'
          curl -fsS -X POST http://127.0.0.1:8000/predict/demanda \
            -H "Content-Type: application/json" \
            -d @/tmp/prueba/solicitud_p1.json | grep -q '"predicciones":'

      - name: Logs de los servicios si algo falló
        if: failure()
        run: docker compose logs

      - name: Apagar el sistema y borrar su volumen
        if: always()
        run: docker compose down -v
