name: CI

# En cada PR a main corren las pruebas y se construye la imagen. Con cada push a main (el merge de
# un PR) corre lo mismo y, si todo pasa, la imagen se publica en GitHub Container Registry
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Por defecto solo lectura; el job publicar pide aparte permiso para escribir paquetes
permissions:
  contents: read

# En un PR, un push nuevo cancela la corrida anterior. En main no se cancela, para que cada merge
# publique su imagen
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    # Un job por objetivo de make, para ver por separado cuál falla
    name: ${{ matrix.objetivo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        objetivo: [lint, test, security]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: make ${{ matrix.objetivo }}
        run: make ${{ matrix.objetivo }}

  docker:
    name: image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Construir la imagen con make image
        run: make image

      - name: Levantar el contenedor con modelos de prueba y verificar /health y cada /predict
        run: |
          mkdir -p /tmp/prueba && chmod 777 /tmp/prueba
          # Los modelos y las solicitudes de prueba se generan con la imagen, que ya trae MLflow
          docker run --rm -v /tmp/prueba:/tmp/prueba -v "$PWD/tests/ci:/ci:ro" mibici-api \
            python /ci/modelos_prueba.py /tmp/prueba
          docker run -d --name mibici-api-test -p 8000:8000 \
            -v /tmp/prueba/modelo:/tmp/modelo:ro \
            -v /tmp/prueba/modelo_p1:/tmp/modelo_p1:ro \
            -e MODELO_URI=/tmp/modelo \
            -e MODELO_URI_P1=/tmp/modelo_p1 \
            mibici-api
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"estado":"ok"'; then
              curl -fsS http://127.0.0.1:8000/health
              if curl -fsS -X POST http://127.0.0.1:8000/predict/riesgo \
                -H "Content-Type: application/json" \
                -d @/tmp/prueba/solicitud.json | grep -q '"predicciones":' \
                && curl -fsS -X POST http://127.0.0.1:8000/predict/demanda \
                -H "Content-Type: application/json" \
                -d @/tmp/prueba/solicitud_p1.json | grep -q '"predicciones":'; then
                docker rm -f mibici-api-test
                exit 0
              fi
              break
            fi
            sleep 1
          done
          docker logs mibici-api-test
          docker rm -f mibici-api-test
          exit 1

  compose:
    # El sistema completo como lo levanta make sistema: MLflow y la API en su red, con la API
    # esperando a que MLflow esté sano. Los modelos de prueba se registran en ese MLflow con el
    # alias champion, así la API los carga del Registry como en producción: esto prueba la red,
    # el encabezado Host (--allowed-hosts), el proxy de artefactos y la resolución del alias
    name: compose
    runs-on: ubuntu-latest
    # El peor caso ronda los 6 minutos (start_period de MLflow); sin límite GitHub espera 6 horas
    timeout-minutes: 15

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Construir la imagen de la API con Compose
        run: docker compose build api

      - name: Levantar MLflow y esperar a que esté sano
        run: docker compose up -d --wait mlflow

      - name: Registrar los modelos de prueba en ese MLflow con el alias champion
        run: |
          mkdir -p /tmp/prueba && chmod 777 /tmp/prueba
          # Sin git en la imagen, MLflow avisa que no puede leer el commit: no hace falta aquí
          docker compose run --rm --no-deps -e GIT_PYTHON_REFRESH=quiet \
            -v "$PWD/tests/ci:/ci:ro" -v /tmp/prueba:/tmp/prueba \
            api python /ci/modelos_prueba.py /tmp/prueba --registrar

      - name: Levantar la API, que carga los modelos del Registry
        run: docker compose up -d --wait api

      - name: Verificar MLflow, /health y cada /predict
        run: |
          docker compose ps
          curl -fsS http://127.0.0.1:5001/health
          curl -fsS http://127.0.0.1:8000/health | tee /tmp/salud.json
          grep -q '"estado":"ok"' /tmp/salud.json
          grep -q '"alias":"champion"' /tmp/salud.json
          curl -fsS -X POST http://127.0.0.1:8000/predict/riesgo \
            -H "Content-Type: application/json" \
            -d @/tmp/prueba/solicitud.json | grep -q '"predicciones":'
          curl -fsS -X POST http://127.0.0.1:8000/predict/demanda \
            -H "Content-Type: application/json" \
            -d @/tmp/prueba/solicitud_p1.json | grep -q '"predicciones":'

      - name: Logs de los servicios si algo falló
        if: failure()
        run: docker compose logs

      - name: Apagar el sistema y borrar su volumen
        if: always()
        run: docker compose down -v

  publicar:
    # Solo con push a main y si pasaron las pruebas, la imagen y el sistema con Compose
    name: publicar
    if: github.event_name == 'push'
    needs: [pipeline, docker, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar Buildx para usar la caché de capas de GitHub
        uses: docker/setup-buildx-action@v3

      - name: Etiquetas de la imagen (commit y latest) y metadatos OCI
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mibici-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  resumen:
    # Resumen de la corrida en la página del workflow, también cuando algo falla
    name: resumen
    if: always()
    needs: [pipeline, docker, compose, publicar]
    runs-on: ubuntu-latest

    steps:
      - name: Escribir el resumen de jobs e imagen
        env:
          PRUEBAS: ${{ needs.pipeline.result }}
          IMAGEN: ${{ needs.docker.result }}
          COMPOSE: ${{ needs.compose.result }}
          PUBLICAR: ${{ needs.publicar.result }}
          REGISTRO: ghcr.io/${{ github.repository_owner }}/mibici-api
        run: |
          {
            echo "## Resultado del pipeline"
            echo ""
            echo "| Job | Resultado |"
            echo "|---|---|"
            echo "| lint, test y security | $PRUEBAS |"
            echo "| image | $IMAGEN |"
            echo "| compose | $COMPOSE |"
            echo "| publicar | $PUBLICAR |"
            if [ "$PUBLICAR" = "success" ]; then
              echo ""
              echo "Imagen publicada: \`$REGISTRO:sha-${GITHUB_SHA::7}\` y \`$REGISTRO:latest\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
