[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mi_bici"
version = "0.0.1"
description = "Propuesta y base reproducible de ML para el sistema MiBici"
authors = [
  { name = "TC5061 Equipo 3" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["mi_bici"]
include = ["pyproject.toml", "mi_bici/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mi_bici"]
force-sort-within-sections = true

[tool.bandit]
# Importar subprocess no es un riesgo por sí solo. bandit sigue revisando cada llamada (B603 y B607)
skips = ["B404"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: levanta MLflow o entrena con muchos datos. make test-fast las salta"]
